# ============================================================================
# job-radar profile — Company Secretary / Corporate Law / Compliance (India)
# Built from the Indeed resume: CS (ICSI), ~6 yrs, Deputy Manager (CS) at a
# Big-4 firm; SEBI / FEMA / M&A / corporate governance / restructuring.
# Preferred: corporate law; min salary INR 25 LPA (not filterable reliably —
# most boards don't publish pay, so it isn't used as a filter).
# Secrets live in GitHub Secrets / .env, never here. Safe to commit.
# ============================================================================

db_path: data/seen-cs.db

max_per_run: 25        # send at most N new jobs per run; rest trickle in later
min_score: 0
dedupe_cross_source: true
translate_titles: false

# ---- What counts as a match --------------------------------------------------
keywords:
  # TITLE must contain ANY of these (title_only: true).
  include:
    - company secretary
    - company secretarial
    - corporate secretarial
    - secretarial
    - assistant company secretary
    - deputy company secretary
    - corporate governance
    - governance
    - corporate law
    - corporate legal
    - legal counsel
    - legal manager
    - legal & compliance
    - legal and compliance
    - compliance & legal
    - compliance and legal
    - legal compliance
    - legal, compliance
    - compliance manager
    - compliance officer
    - compliance lead
    - regulatory compliance
    - regulatory affairs manager
    - sebi
    - fema
    - listing compliance
    - entity management
    - entity governance
    - board secretariat
    - m&a
    - corporate restructuring
  # title + snippet must contain NONE of these (too junior)
  exclude:
    - intern
    - internship
    - trainee
    - fresher
    - articleship
    - articled
  # TITLE must contain NONE of these (off-domain roles sharing a keyword)
  exclude_title:
    - engineer
    - developer
    - software
    - data governance
    - it governance
    - it compliance
    - cyber
    - security
    - clinical
    - quality
    - pharmacovigilance
    - drug
    - medical
    - sales
    - recruiter
    - teacher
    - junior
    - paralegal
  title_only: true

# ---- Where -------------------------------------------------------------------
# Mumbai + Thane (incl. Navi Mumbai) = kept in ANY work mode (onsite/hybrid).
# Anywhere else in India = kept ONLY if the role is explicitly remote.
home_locations:
  - mumbai
  - navi mumbai
  - thane
remote_ok: true                 # plain "Remote" postings (no city) are kept
remote_only_outside_home: true  # elsewhere: remote only (no hybrid/unknown)
region_locations:
  - india
  - mumbai
  - pune
  - bengaluru
  - bangalore
  - gurugram
  - gurgaon
  - noida
  - delhi
  - new delhi
  - hyderabad
  - chennai
  - ahmedabad
  - kolkata
  - jaipur
  - indore
  - lucknow
  - chandigarh
  - kochi
  - coimbatore
  - nagpur
  - vadodara
  - surat
  # states (boards often give "City, State" with no country)
  - maharashtra
  - karnataka
  - haryana
  - uttar pradesh
  - telangana
  - tamil nadu
  - gujarat
  - west bengal
  - rajasthan
  - madhya pradesh
  - kerala
  - punjab

# ---- Where to look -----------------------------------------------------------
sources:
  # Germany-only sources from the original repo — off for an India search.
  arbeitsagentur:
    enabled: false
  adzuna:
    enabled: false
  bigtech:
    amazon:
      enabled: false

  # Job boards via JobSpy. Naukri + Indeed India are the main Indian boards;
  # LinkedIn + Google add breadth (both can rate-limit from cloud IPs — a
  # failing site just logs a warning, the rest still run).
  jobspy:
    enabled: true
    sites:
      - naukri
      - indeed
      - linkedin
      - google
    search_terms:
      - company secretary
      - corporate secretarial
      - corporate governance
      - compliance manager
      - legal counsel corporate
    # Each term is searched in each location below (keep this list short —
    # terms x locations x sites requests per run).
    locations:
      - "Mumbai, India"
      - "Thane, India"
      - { location: "India", remote: true }   # remote roles anywhere in India
    results_wanted: 40
    hours_old: 72
    country_indeed: india
